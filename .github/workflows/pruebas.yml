name: Pruebas - Estadio y Seguridad

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest-suite:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear entorno de prueba y bases de datos test
        env:
          MYSQL_PWD: root
        run: |
          cat <<EOF > .env
          DB_HOST=127.0.0.1
          DB_USER=root
          DB_PASSWORD=root
          FLASK_ENV=testing
          EOF

          mysql -h 127.0.0.1 -u root -e "
            CREATE DATABASE IF NOT EXISTS estadio_db_test DEFAULT CHARACTER SET utf8mb4;
            CREATE DATABASE IF NOT EXISTS seguridad_test DEFAULT CHARACTER SET utf8mb4;
          "

      - name: Ejecutar pruebas con PyTest
        working-directory: test
        run: |
          pytest -W ignore