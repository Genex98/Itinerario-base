name: Pruebas - Estadio y Seguridad

on:
  push:
    branches: [ "main", "develop", "gene" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest-suite:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install pytest playwright pytest-playwright
          playwright install chromium --with-deps

      - name: Crear entorno de prueba y bases de datos test
        env:
          MYSQL_PWD: root
        run: |
          cat <<EOF > .env
          DB_HOST=127.0.0.1
          DB_USER=root
          DB_PASSWORD=root
          FLASK_ENV=testing
          EOF

          mysql -h 127.0.0.1 -u root -e "
            CREATE DATABASE IF NOT EXISTS estadio_db_test DEFAULT CHARACTER SET utf8mb4;
            CREATE DATABASE IF NOT EXISTS seguridad_test DEFAULT CHARACTER SET utf8mb4;
          "
          
      - name: Ejecutar pruebas con PyTest
        run: |
          # Arrancar servidor Flask en segundo plano en el puerto 5001
          FLASK_RUN_PORT=5001 python run.py &
          
          # Esperar hasta 15 segundos a que el puerto 5001 responda
          for i in {1..15}; do
            if curl -s http://127.0.0.1:5001 > /dev/null; then
              echo "Servidor Flask listo en puerto 5001"
              break
            fi
            sleep 1
          done

          # Ejecutar todas las pruebas
          cd tests
          pytest -W ignore --ignore=rendimiento
